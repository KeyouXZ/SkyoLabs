[package]
edition = "2024"
name = "schoolesp"
rust-version = "1.95"
version = "0.2.0"

[[bin]]
name = "schoolesp"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "log-04", "esp-radio", "embassy"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32", "wifi"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
log = "0.4.27"

critical-section = "1.2.0"
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
nb = "1.1.0"
embedded-graphics = "0.8.2"
anyhow = { version = "1.0.104", default-features = false }
heapless = "0.9.3"
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
static_cell = "2.1.1"
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
embassy-net = "0.9.1"
edge-captive = "0.8.0"
embedded-io-async = "0.7.0"

[features]
dummy = []

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
